name: Build MongoDB (No AVX)

on:
  workflow_dispatch:
    inputs:
      mongodb_version:
        description: 'MongoDB Version (e.g., r7.0.5)'
        required: true
        default: 'r7.0.5'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout MongoDB source
        uses: actions/checkout@v4
        with:
          repository: mongodb/mongo
          ref: ${{ github.event.inputs.mongodb_version }}
          path: mongo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev liblzma-dev python3-pip lld clang
          python3 -m pip install jsonschema
          python3 -m pip install -r mongo/etc/pip/compile-requirements.txt

      - name: Build MongoDB
        run: |
          cd mongo
          # -sandybridge removes AVX requirements
          # --disable-warnings-as-errors prevents build failure on minor warnings
          # install-mongod builds the main server binary
          # --linker=lld uses the faster/modern linker installed above
          python3 buildscripts/scons.py install-mongod \
            --experimental-optimization="-sandybridge" \
            --linker=lld \
            --disable-warnings-as-errors \
            -j$(nproc)

      - name: Upload mongod binary
        uses: actions/upload-artifact@v4
        with:
          name: mongod-no-avx-${{ github.event.inputs.mongodb_version }}
          path: mongo/build/install/bin/mongod
