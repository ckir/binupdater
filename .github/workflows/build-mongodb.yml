name: Build MongoDB (No AVX)

on:
  workflow_dispatch:
    inputs:
      mongodb_version:
        description: 'MongoDB Version (e.g., r8.0.23)'
        required: true
        default: 'r8.0.23'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout MongoDB source
        uses: actions/checkout@v6
        with:
          repository: mongodb/mongo
          ref: ${{ github.event.inputs.mongodb_version }}
          path: mongo

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev liblzma-dev lld

      - name: Install bazelisk
        run: |
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 \
            -o /tmp/bazel
          sudo mv /tmp/bazel /usr/local/bin/bazel
          sudo chmod +x /usr/local/bin/bazel

      - name: Build MongoDB
        run: |
          cd mongo
          bazel build //src/mongo/db:mongod \
            --config=local \
            --config=opt \
            --build_enterprise=False \
            --linker=lld \
            --disable_warnings_as_errors=True \
            --copt=-march=sandybridge \
            -j$(nproc)

      - name: Upload mongod binary
        uses: actions/upload-artifact@v7
        with:
          name: mongod-no-avx-${{ github.event.inputs.mongodb_version }}
          path: mongo/bazel-bin/src/mongo/db/mongod
