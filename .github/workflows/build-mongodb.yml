name: Build MongoDB (No AVX)

on:
  workflow_dispatch:
    inputs:
      mongodb_version:
        description: 'MongoDB Version (e.g., r8.0.15)'
        required: true
        default: 'r8.0.15'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout MongoDB source
        uses: actions/checkout@v6
        with:
          repository: mongodb/mongo
          ref: ${{ github.event.inputs.mongodb_version }}
          path: mongo

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev liblzma-dev python3-pip lld
          python3 -m pip install -r mongo/poetry_requirements.txt
          cd mongo && python3 -m poetry install --no-root

      - name: Set up SCons
        run: |
          python3 -m pip install "scons==4.9.1"
          SCONS_LOCAL=mongo/src/third_party/scons-4.9.1/scons-local-4.9.1
          mkdir -p $SCONS_LOCAL
          SCONS_PKG=$(python3 -c "import SCons, os; print(os.path.dirname(SCons.__file__))")
          ln -sf $SCONS_PKG $SCONS_LOCAL/SCons

      - name: Build MongoDB
        run: |
          cd mongo
          python3 -m poetry run python3 buildscripts/scons.py install-mongod \
            --experimental-optimization="-sandybridge" \
            --linker=lld \
            --disable-warnings-as-errors \
            -j$(nproc)

      - name: Upload mongod binary
        uses: actions/upload-artifact@v7
        with:
          name: mongod-no-avx-${{ github.event.inputs.mongodb_version }}
          path: mongo/build/install/bin/mongod
