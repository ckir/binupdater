[tools.rtk]
repo = "rtk-ai/rtk"
description = "CLI proxy that reduces LLM token consumption by 60-90% on common dev commands. Single Rust binary, zero dependencies"
version_args = [
    "--version",
]
version_regex = "(\\d+\\.\\d+\\.\\d+(?:[.\\-][a-zA-Z0-9]+)*)"
installed_version = "0.42.3"

[tools.rtk.platforms.windows]
asset_pattern = "rtk-x86_64-pc-windows-msvc.zip"
files_in_archive = [
    "rtk.exe",
]
binary_names = [
    "rtk.exe",
]
install_path = "C:\\!PORTABLES\\!BIN\\rtk.exe"

[tools.rtk.platforms.linux]
asset_pattern = "rtk-x86_64-unknown-linux-musl.tar.gz"
files_in_archive = [
    "rtk",
]
binary_names = [
    "rtk",
]
install_path = "~/.bin/rtk"

[tools.websocat]
repo = "vi/websocat"
description = "Command-line client for WebSockets, like netcat (or curl) for ws:// with advanced socat-like functions"
version_args = [
    "--version",
]
version_regex = "(\\d+\\.\\d+\\.\\d+(?:[.\\-][a-zA-Z0-9]+)*)"
installed_version = "1.14.1"

[tools.websocat.platforms.windows]
asset_pattern = "websocat.x86_64-pc-windows-gnu.exe"
binary_names = [
    "websocat.exe",
]
install_path = "C:\\!PORTABLES\\!BIN\\websocat.exe"

[tools.websocat.platforms.linux]
asset_pattern = "websocat.x86_64-unknown-linux-musl"
binary_names = [
    "websocat",
]
install_path = "~/.bin/websocat"
