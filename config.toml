[settings.default_install]
windows = "C:\\!PORTABLES\\!BIN"
linux = "~/.bin"

[tools.fd]
repo = "sharkdp/fd"
description = "A simple, fast and user-friendly alternative to 'find'"
version_args = [
    "--version",
]
version_regex = "(\\d+\\.\\d+\\.\\d+(?:[.\\-][a-zA-Z0-9]+)*)"
installed_version = "10.4.2"

[tools.fd.platforms.windows]
asset_pattern = "fd-*-x86_64-pc-windows-msvc.zip"
files_in_archive = [
    "fd-*-x86_64-pc-windows-msvc/fd.exe",
]
install_path = "C:\\!PORTABLES\\!BIN\\fd.EXE"

[tools.fd.platforms.linux]
asset_pattern = "fd-*-x86_64-unknown-linux-musl.tar.gz"
files_in_archive = [
    "fd-*-x86_64-unknown-linux-musl/fd",
]
install_path = "~/.bin/fd"

[tools.rip]
repo = "MilesCranmer/rip2"
description = "A safe and ergonomic alternative to rm"
version_args = [
    "--version",
]
version_regex = "(\\d+\\.\\d+\\.\\d+(?:[.\\-][a-zA-Z0-9]+)*)"
installed_version = "0.9.6"

[tools.rip.platforms.windows]
asset_pattern = "rip-Windows-x86_64.zip"
files_in_archive = [
    "rip.exe",
]
install_path = "C:\\!PORTABLES\\!BIN\\rip.EXE"

[tools.rip.platforms.linux]
asset_pattern = "rip-Linux-x86_64-musl.tar.gz"
files_in_archive = [
    "rip",
]
install_path = "~/.bin/rip"

[tools.pmux]
repo = "psmux/psmux"
description = "Tmux on Windows Powershell - tmux for PowerShell, Windows Terminal, cmd.exe. Includes psmux, pmux, and tmux commands. This is native Powershell Tmux designed for Windows in Rust 🦀"
version_args = [
    "--version",
]
version_regex = "(\\d+\\.\\d+\\.\\d+(?:[.\\-][a-zA-Z0-9]+)*)"
installed_version = "3.3.5"

[tools.pmux.platforms.windows]
asset_pattern = "psmux-*-windows-x64.zip"
files_in_archive = [
    "pmux.exe",
    "psmux.exe",
    "tmux.exe",
]
binary_names = [
    "pmux.exe",
    "psmux.exe",
    "tmux.exe",
]
install_path = "C:\\!PORTABLES\\!BIN\\pmux.exe"
